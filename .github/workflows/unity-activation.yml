name: unity-activation

# Produces the Unity activation request (.alf) needed to obtain a Personal
# licence for CI. Run this once, by hand; it is never part of the normal build.
#
# Why this exists as a workflow rather than a local step: the .alf must be
# generated by the same Unity version the test job runs (see
# ProjectSettings/ProjectVersion.txt), and nothing heavy runs locally in this
# repo (config/agent.config.json -> execution_policy).
#
# The full loop:
#
#   1. Run this workflow. Download the `unity-activation-file` artifact.
#   2. Upload the .alf to https://license.unity3d.com/manual and sign in.
#      Choose Unity Personal, then "I don't use Unity in a professional
#      capacity" unless that is untrue. Download the resulting .ulf.
#   3. Store the .ulf as a repository secret:
#        gh secret set UNITY_LICENSE < Unity_v6000.x.ulf
#
# Step 2 is the only manual part and the only one that needs your Unity
# account. The .alf itself contains no credentials.
#
# Accounts created through Sign in with Apple have no Unity password, so the
# UNITY_EMAIL + UNITY_PASSWORD route in unity-test.yml will not work for them.
# UNITY_LICENSE is the route that does.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the version from the project rather than hard-coding it: a licence
      # requested for the wrong Unity version activates but then fails at test
      # time, which is a slow and confusing way to discover a typo.
      - name: Resolve the project's Unity version
        id: version
        run: |
          VERSION=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "::error::could not read m_EditorVersion from ProjectSettings/ProjectVersion.txt"
            exit 1
          fi
          echo "unity=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Requesting activation for Unity $VERSION"

      - uses: game-ci/unity-request-activation-file@v2
        id: alf
        with:
          unityVersion: ${{ steps.version.outputs.unity }}

      - uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.alf.outputs.filePath }}
          if-no-files-found: error

      - name: Next steps
        run: |
          {
            echo "## Unity activation request ready"
            echo
            echo "Unity version: \`${{ steps.version.outputs.unity }}\`"
            echo
            echo "1. Download the **unity-activation-file** artifact from this run."
            echo "2. Upload the \`.alf\` at <https://license.unity3d.com/manual> and sign in."
            echo "3. Save the returned \`.ulf\` as a secret:"
            echo
            echo '   ```'
            echo "   gh secret set UNITY_LICENSE < Unity_v${{ steps.version.outputs.unity }}.ulf"
            echo '   ```'
            echo
            echo "The \`.alf\` contains no credentials. The \`.ulf\` is a licence file:"
            echo "keep it out of the repository, which is public."
          } >> "$GITHUB_STEP_SUMMARY"
