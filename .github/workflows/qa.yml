name: qa

# The workflow `test_run` dispatches to (gateway/handlers.py:h_test_run).
#
# enforce.yml already runs the whole Python suite on every push, and that stays
# the gate. This is the *technique-scoped* entry point: it runs one suite at a
# time with the floor that makes that suite's result mean something -- a
# mutation score, a timing budget, a coverage minimum -- so a specific question
# can be asked without waiting on everything else.
#
# Every input mirrors a field of schema/agent.schema.json -> definitions.TestOp.
# The schema is where the floors are actually enforced for gateway callers; the
# defaults here exist for a human clicking "Run workflow", who has no schema in
# front of them. They are deliberately the same numbers.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which technique to run"
        required: true
        default: "unit"
        type: choice
        options:
          - unit
          - regression
          - property
          - metamorphic
          - mutation
          - contract
          - soak
          - performance
          - all
      scope:
        description: "pytest -k expression (optional)"
        required: false
        type: string
      min_tests:
        description: "Fail unless at least this many tests ran. Never 0."
        required: false
        default: "1"
        type: string
      seed:
        description: "PRNG seed. Required by the schema for property/soak."
        required: false
        type: string
      coverage_min:
        description: "Line+branch coverage floor, percent"
        required: false
        default: "99"
        type: string
      mutation_score_min:
        description: "Percent of mutants the suite must kill"
        required: false
        default: "80"
        type: string
      budget_ms:
        description: "Wall-clock ceiling for the performance suite"
        required: false
        default: "60000"
        type: string

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      JFA_CI: "1"
      # Replaying a worked example must never fire a real workflow run: a
      # ci_dispatch or test_run example would otherwise dispatch from inside
      # this job and loop. Same guard enforce.yml relies on.
      JFA_NO_DISPATCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # A floor of 0 is the one value the schema refuses to express. Accepting
      # it here would reintroduce the hole through the manual-dispatch door.
      - name: Reject a zero-test floor
        run: |
          if [ "${{ inputs.min_tests }}" -lt 1 ] 2>/dev/null; then
            echo "::error::min_tests must be >= 1. pytest exits 0 when it collects"
            echo "::error::nothing, so a floor of 0 asks for a run that cannot fail."
            exit 1
          fi

      - name: Select the suite
        id: select
        run: |
          case "${{ inputs.suite }}" in
            unit)        target="tests/ --ignore=tests/test_property_invariants.py --ignore=tests/test_metamorphic.py" ;;
            regression)  target="tests/test_schema_contract.py" ;;
            contract)    target="tests/test_schema_contract.py tests/test_gateway.py" ;;
            property)    target="tests/test_property_invariants.py" ;;
            metamorphic) target="tests/test_metamorphic.py" ;;
            soak)        target="tests/test_metamorphic.py tests/test_property_invariants.py" ;;
            performance) target="tests/" ;;
            mutation)    target="tests/" ;;
            all)         target="tests/" ;;
            *) echo "::error::unknown suite '${{ inputs.suite }}'"; exit 1 ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"

      # --junitxml is what makes the "did anything actually run" check possible.
      # pytest's exit code cannot distinguish "all passed" from "collected none".
      - name: Run
        id: run
        continue-on-error: true
        env:
          # Hypothesis reads this; a fixed seed makes a property failure
          # replayable, which is the whole reason TestOp.seed is required for
          # the randomised suites.
          HYPOTHESIS_SEED: ${{ inputs.seed }}
        run: |
          args=""
          [ -n "${{ inputs.scope }}" ] && args="-k '${{ inputs.scope }}'"
          if [ -n "$HYPOTHESIS_SEED" ]; then
            args="$args --hypothesis-seed=$HYPOTHESIS_SEED"
          fi
          eval python -m pytest ${{ steps.select.outputs.target }} -q \
            --junitxml=junit.xml --cov --cov-report=xml --cov-report=term-missing $args

      # The gate that pytest's exit code cannot provide.
      - name: Assert tests actually ran
        if: always()
        run: |
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          floor = int(os.environ["MIN_TESTS"])
          try:
              root = ET.parse("junit.xml").getroot()
          except (OSError, ET.ParseError) as e:
              print(f"::error::no usable junit.xml ({e}); pytest never produced results")
              sys.exit(1)
          suites = [root] if root.tag == "testsuite" else list(root)
          total = sum(int(s.get("tests", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          ran = total - skipped
          print(f"collected {total}, ran {ran}, failed {failed}, skipped {skipped}")
          if failed:
              print(f"::error::{failed} test(s) failed")
              sys.exit(1)
          if ran < floor:
              print(f"::error::only {ran} test(s) ran, expected at least {floor} -- "
                    f"pytest exits 0 when it collects nothing")
              sys.exit(1)
          print("qa gate passed")
          PY
        env:
          MIN_TESTS: ${{ inputs.min_tests }}

      # The performance suite's own gate. TestOp.budget_ms is required for it
      # precisely so there is a number to compare against here -- a timing run
      # with no budget produces a measurement, not a verdict.
      - name: Enforce the wall-clock budget
        if: always() && inputs.suite == 'performance'
        run: |
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          budget_ms = float(os.environ["BUDGET_MS"])
          root = ET.parse("junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          elapsed_ms = sum(float(s.get("time", 0)) for s in suites) * 1000
          print(f"suite wall clock {elapsed_ms:.0f}ms, budget {budget_ms:.0f}ms")
          slowest = sorted(
              ((float(c.get("time", 0)), c.get("classname", ""), c.get("name", ""))
               for s in suites for c in s.iter("testcase")),
              reverse=True,
          )[:5]
          for seconds, cls, name in slowest:
              print(f"  {seconds * 1000:8.0f}ms  {cls}::{name}")
          if elapsed_ms > budget_ms:
              print(f"::error::suite took {elapsed_ms:.0f}ms, over the {budget_ms:.0f}ms budget")
              sys.exit(1)
          PY
        env:
          BUDGET_MS: ${{ inputs.budget_ms }}

      - name: Enforce the coverage floor
        if: always() && (inputs.suite == 'all' || inputs.suite == 'unit')
        run: python scripts/check_coverage.py --min "${{ inputs.coverage_min }}" --report coverage.xml

      # Mutation testing answers the question coverage cannot: coverage says a
      # line was executed, mutation says a test would have noticed it changing.
      # Scoped to gateway/ because that is what .coveragerc measures.
      - name: Mutation score
        if: inputs.suite == 'mutation'
        run: |
          set -o pipefail
          mutmut run --paths-to-mutate gateway/ --no-progress || true
          mutmut results > mutants.txt || true
          python - <<'PY'
          import os, re, sys, pathlib
          text = pathlib.Path("mutants.txt").read_text() if pathlib.Path("mutants.txt").exists() else ""
          survived = len(re.findall(r"^\s*#\d+", text, re.M))
          killed_m = re.search(r"(\d+)\s+killed", text)
          killed = int(killed_m.group(1)) if killed_m else 0
          total = killed + survived
          if not total:
              print("::error::mutmut produced no mutants; the run did not happen")
              sys.exit(1)
          score = 100.0 * killed / total
          floor = float(os.environ["FLOOR"])
          print(f"mutation score {score:.1f}% ({killed}/{total} killed), floor {floor}%")
          if score < floor:
              print(f"::error::mutation score {score:.1f}% is below the {floor}% floor -- "
                    f"the suite executes this code but would not notice it changing")
              sys.exit(1)
          PY
        env:
          FLOOR: ${{ inputs.mutation_score_min }}

      - name: Summarise
        if: always()
        run: |
          {
            echo "## qa — suite \`${{ inputs.suite }}\`"
            echo
            echo "| setting | value |"
            echo "|---|---|"
            echo "| min_tests | ${{ inputs.min_tests }} |"
            echo "| seed | ${{ inputs.seed || '—' }} |"
            echo "| scope | ${{ inputs.scope || 'all' }} |"
            echo "| pytest outcome | ${{ steps.run.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ inputs.suite }}
          path: |
            junit.xml
            coverage.xml
            mutants.txt

      # Last, so the artifacts and the summary exist even on a red run.
      - name: Fail if the run itself did not pass
        if: steps.run.outcome != 'success'
        run: |
          echo "::error::pytest outcome was ${{ steps.run.outcome }}"
          exit 1
