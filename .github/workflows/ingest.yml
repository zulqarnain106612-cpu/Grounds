name: ingest
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this ingest was triggered"
        required: false
        default: "manual"
      commit:
        description: "Commit refreshed indexes back to the branch"
        required: false
        default: "true"
  schedule:
    # Poll for drift: rebuild indexes nightly. Replaces any local polling loop.
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      JFA_CI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Rebuild symbol index
        run: python -m gateway.symbol_scanner

      - name: Rebuild KB index and knowledge graph
        run: python -m gateway.ingest

      - name: Rebuild manifest
        run: python -m gateway.manifest

      - name: Assert the KB is non-empty and retrievable
        run: python -m gateway.verify_retrieval

      - name: Validate repo after ingest
        run: python -m gateway.validate_repo

      - name: Summarise
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          kb = json.load(open("index/kb.index.json"))
          g = json.load(open("knowledge/graph.json"))["graph"]
          s = json.load(open("symbols/index.json"))
          m = json.load(open("index/manifest.json"))
          print("## Ingest result\n")
          print(f"| artifact | count |\n| --- | --- |")
          print(f"| kb chunks | {kb['chunk_count']} |")
          print(f"| graph nodes | {len(g['nodes'])} |")
          print(f"| graph edges | {len(g['edges'])} |")
          print(f"| symbols | {len(s['symbols'])} |")
          print(f"| manifest files | {m['counts']['files']} |")
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: indexes
          path: |
            index/kb.index.json
            index/manifest.json
            knowledge/graph.json
            symbols/index.json

      # main is protected by a ruleset requiring changes to arrive via pull
      # request, so refreshed indexes are proposed on a branch rather than
      # pushed straight to the base ref -- except on the default branch
      # itself, where such a pull request cannot merge at all. See below.
      - name: Propose refreshed indexes
        if: github.event.inputs.commit != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index/kb.index.json index/manifest.json knowledge/graph.json symbols/index.json
          if git diff --cached --quiet; then
            echo "indexes already up to date; nothing to propose"
            exit 0
          fi
          # The byte comparison above never fires: every generator stamps a
          # fresh generated_at/updated_at on each run, so the staged diff is
          # always non-empty. Left in place as the cheap path, it is followed
          # by the comparison that decides -- the same content-only definition
          # of freshness that enforce.yml gates on. Without this, the nightly
          # cron opened a pull request a day whose whole content was a moved
          # clock (#199-#208), each conflicting with the last.
          if ! python scripts/ingest_content_changed.py; then
            echo "indexes are content-identical; nothing to propose" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A pull request into the default branch would be unmergeable, so
          # this reports the drift instead of opening one.
          #
          # GitHub suppresses `pull_request` workflow triggers for pull
          # requests opened with GITHUB_TOKEN -- its loop prevention. The
          # default branch's ruleset requires the `validate` and `coverage`
          # contexts, and neither workflow ever runs on such a pull request,
          # so the two required checks can never appear and the merge is
          # refused with "2 of 2 required status checks are expected".
          # Verified on #242.
          #
          # That is the other half of the #199-#208 story. ADR-013 stopped the
          # useless ones from being created; this is why even a useful one
          # could not land, and why ten of them accumulated rather than being
          # merged and forgotten.
          #
          # A PAT would make the pull request mergeable and is the usual
          # answer. It is declined here: a token with write access to the
          # default branch, held to spare one dispatch, is a poor trade
          # against the drift being visible and a human-or-agent branch
          # carrying the fix through the same gates as any other change.
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            {
              echo "### The indexes on \`${{ github.ref_name }}\` have drifted"
              echo
              echo "Not proposed as a pull request: one opened with GITHUB_TOKEN"
              echo "triggers no \`pull_request\` workflows, so the \`validate\` and"
              echo "\`coverage\` contexts this branch's ruleset requires never appear"
              echo "and it cannot be merged."
              echo
              echo "Refresh it from a branch instead:"
              echo '```'
              echo "make ingest REF=<your-branch>"
              echo '```'
              echo
              echo "Changed:"
              git diff --cached --stat
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::indexes on ${{ github.ref_name }} have drifted; refresh them from a branch (see the job summary)"
            exit 1
          fi

          BRANCH="chore/ingest-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore(ingest): refresh kb index, graph, symbols, manifest"
          git push origin "$BRANCH"
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH" \
            --title "chore(ingest): refresh generated indexes" \
            --body "Automated ingest from run ${{ github.run_id }}. Regenerates \`index/kb.index.json\`, \`index/manifest.json\`, \`knowledge/graph.json\` and \`symbols/index.json\`. Retrieval was verified against the rebuilt KB before this PR was opened."
          echo "opened PR from $BRANCH" >> "$GITHUB_STEP_SUMMARY"
