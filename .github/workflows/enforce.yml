name: agent-schema-enforcement
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      JFA_CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate schema, config, examples, handler coverage
        run: python -m gateway.validate_repo
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: Rebuild indexes and fail if stale
        run: |
          python -m gateway.symbol_scanner
          python -m gateway.ingest
          python - <<'PY'
          import json, subprocess, sys
          # updated_at/built_at move on every run, so compare content only --
          # diffing the whole file would fail unconditionally.
          for path, keys in (("symbols/index.json", ["symbols"]),
                             ("index/kb.index.json", ["chunks", "chunk_count"]),
                             ("knowledge/graph.json", ["graph"])):
              head = subprocess.run(["git", "show", f"HEAD:{path}"],
                                    capture_output=True, text=True)
              if head.returncode != 0:
                  print(f"::error::{path} is not tracked in git")
                  sys.exit(1)
              before, after = json.loads(head.stdout), json.load(open(path))
              if "generated_by" not in before:
                  print(f"::notice::{path} is still an unseeded stub; skipping staleness "
                        f"check. Run the ingest workflow to publish the first real index.")
                  continue
              for k in keys:
                  if before.get(k) != after.get(k):
                      print(f"::error::{path} is stale: '{k}' differs from a fresh ingest. "
                            f"Run the ingest workflow and commit the result.")
                      sys.exit(1)
          print("symbol index, kb index and graph are all fresh")
          PY
