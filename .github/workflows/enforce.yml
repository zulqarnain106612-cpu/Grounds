name: agent-schema-enforcement
# `push` is restricted to main on purpose. A branch push and its own
# pull_request event are two runs of the same workflow on the same commit, so
# an unrestricted `push:` doubled every check's cost and queue time for zero
# extra signal. PRs below still run on every commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded commits stop running the moment a newer one arrives. Without
# this, pushing three fixes in a row leaves three full runs competing for the
# same runners and the newest one finishes last.
concurrency:
  group: enforce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      JFA_CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Restores the pip wheel cache keyed on requirements.txt. A cold
          # install of jsonschema + pytest + hypothesis is most of this job's
          # runtime; a warm one is seconds.
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate schema, config, examples, handler coverage
        run: python -m gateway.validate_repo
      # The suite is NOT run here. coverage.yml runs the same tests with
      # coverage instrumentation and fails on the same failures, so running
      # them again in this job was a second full execution of tests/ for no
      # additional signal. This job is the schema/index gate; that one is the
      # test gate.
      - name: Rebuild indexes and fail if stale
        run: |
          python -m gateway.symbol_scanner
          python -m gateway.ingest
          python - <<'PY'
          import json, subprocess, sys
          # updated_at/built_at move on every run, so compare content only --
          # diffing the whole file would fail unconditionally.
          for path, keys in (("symbols/index.json", ["symbols"]),
                             ("index/kb.index.json", ["chunks", "chunk_count"]),
                             ("knowledge/graph.json", ["graph"])):
              head = subprocess.run(["git", "show", f"HEAD:{path}"],
                                    capture_output=True, text=True)
              if head.returncode != 0:
                  print(f"::error::{path} is not tracked in git")
                  sys.exit(1)
              before, after = json.loads(head.stdout), json.load(open(path))
              if "generated_by" not in before:
                  print(f"::notice::{path} is still an unseeded stub; skipping staleness "
                        f"check. Run the ingest workflow to publish the first real index.")
                  continue
              for k in keys:
                  if before.get(k) != after.get(k):
                      print(f"::error::{path} is stale: '{k}' differs from a fresh ingest. "
                            f"Run the ingest workflow and commit the result.")
                      sys.exit(1)
          print("symbol index, kb index and graph are all fresh")
          PY
