name: unity-test

# Runs the C# EditMode and PlayMode suites. Every phase spec's acceptance
# criteria assume C# tests exist; before this workflow there was nowhere for
# them to run (docs/CYCLE0_BOOTSTRAP_SPEC.md section 0).
#
# Two failure modes this workflow exists to avoid, both of which report green:
#
#   1. Zero discovered tests. The Unity runner exits 0 when it finds nothing,
#      so a broken .asmdef silently stops verifying anything and the job stays
#      green forever. scripts/check_unity_results.py asserts the counts.
#   2. A missing Unity licence. Skipping the job without one turns the gate
#      into decoration. The preflight below fails loudly and says exactly what
#      to configure.

on:
  push:
    # Scoped to main for the same reason enforce.yml and coverage.yml are:
    # without it a push to a pull request branch runs this workflow once on
    # `push` and again on `pull_request`, two full runs of the same commit.
    # Here that is not merely slow -- each run activates a Unity seat per
    # test mode, and a Personal account holds very few, so the duplicate run
    # competes with the one the pull request actually gates on.
    branches: [main]
    paths:
      - "Assets/**"
      - "ProjectSettings/**"
      - "Packages/**"
      - "scripts/check_unity_results.py"
      - ".github/workflows/unity-test.yml"
  pull_request:
    paths:
      - "Assets/**"
      - "ProjectSettings/**"
      - "Packages/**"
      - "scripts/check_unity_results.py"
      - ".github/workflows/unity-test.yml"
  workflow_dispatch:

permissions:
  contents: read

# Per-ref, because a repo-wide group does not queue: GitHub keeps at most one
# pending run per group and cancels the rest, so serialising branches that way
# turns every superseded branch's check red for a reason that has nothing to
# do with its code.
#
# Seat pressure is real -- a Personal account holds very few, and every
# activation takes one until it is returned -- but the fix for it is
# max-parallel below, which stops one run from asking for two at once, plus
# not landing two branches at the same time. Cancelling is not a fix.
concurrency:
  group: unity-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Separated from the test job so the licence problem is reported as its own
  # red step with an actionable message, rather than as an opaque Unity
  # activation error 20 minutes into a container pull.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require a Unity licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "Unity account credentials present (personal or pro seat)."
            exit 0
          fi
          if [ -n "$UNITY_LICENSE" ]; then
            echo "Unity licence file present."
            exit 0
          fi
          echo "::error::No Unity licence configured, so the C# suites cannot run."
          echo "::error::Set UNITY_EMAIL + UNITY_PASSWORD (Personal seat, or Pro with UNITY_SERIAL)."
          echo "::error::A .ulf in secrets.UNITY_LICENSE also works, but Unity has withdrawn"
          echo "::error::manual activation for Personal seats, so free accounts cannot obtain one."
          echo "::error::Failing rather than skipping on purpose: a skipped test gate is a green lie."
          exit 1

  test:
    needs: preflight
    runs-on: ubuntu-latest
    # game-ci posts the suite's results as a check run using the ambient
    # GITHUB_TOKEN. It does that whether or not `githubToken` is passed, so
    # dropping the permission does not stop the post -- it makes the post 403
    # and fails the job *after* every test has passed. Verified the hard way.
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      # One seat at a time: editmode and playmode activating in parallel is
      # two Personal seats for one run.
      max-parallel: 1
      matrix:
        testMode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      # Library/ is gitignored and rebuilding it from scratch is most of the
      # job's runtime, so it is cached per test mode and project state.
      - uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      # No continue-on-error. The gate below carries `if: always()` instead,
      # which keeps the property that matters -- the gate still runs and still
      # says *why* the job is red -- without the property that cost hours:
      # continue-on-error marks the step successful, and a successful step's
      # log is not in the failed-step log. Every licence activation error this
      # runner printed was therefore invisible, and the only symptom reaching
      # anyone was the gate downstream reporting a missing artifacts directory.
      # Pinned to a commit, not @v4: a floating tag on a third-party action
      # is an unreviewed code path into a job that holds a Unity credential.
      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213
        id: runner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          checkName: ${{ matrix.testMode }} results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # Coverage is measured on the runtime assembly only -- including the
          # test assemblies would count code that is 100% covered by definition
          # and inflate the number until it stopped meaning anything. Same
          # reasoning as .coveragerc excluding tests/ on the Python side.
          coverageOptions: >-
            generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;
            assemblyFilters:+JetFighter.Runtime,-*Tests*

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The real gate. Runs even when the runner step failed, so a red job
      # still says whether the cause was failing tests or none at all.
      - name: Say so when the runner never started
        if: always() && steps.runner.outcome != 'success'
        run: |
          echo "::error::game-ci/unity-test-runner exited ${{ steps.runner.outcome }}."
          echo "::error::Its own step log above carries the reason. The usual one on a"
          echo "::error::Personal seat is seat exhaustion -- a seat is held until returned,"
          echo "::error::and a cancelled or killed job leaks one. Release stale seats at"
          echo "::error::https://id.unity.com. The other is a 2FA or new-device challenge,"
          echo "::error::which headless activation cannot answer."

      # The gate's counts also go to the job summary, so the numbers are
      # readable without opening the check.
      - name: Gate on the results file
        id: gate
        if: always()
        run: |
          set -o pipefail
          python scripts/check_unity_results.py \
            --results "${{ matrix.testMode }}-artifacts" --min-tests 1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # game-ci publishes "<mode> results" with conclusion `neutral` even when
      # every test passed -- that check read "825/825 - Passed" while sitting
      # neutral. A square that can never be green cannot be required and is
      # not a verdict, so this replaces the conclusion with the one the gate
      # above actually reached.
      #
      # The action posts as the github-actions app with GITHUB_TOKEN, and this
      # step runs as that same app, which is what makes the check updatable:
      # GitHub only lets an app update check runs it created itself.
      - name: Make the results check say what the gate decided
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const name = `${{ matrix.testMode }} results`;
            // The action posts against the PR head, not the merge commit that
            // context.sha names on a pull_request event.
            const sha = context.payload.pull_request
              ? context.payload.pull_request.head.sha
              : context.sha;
            const gate = '${{ steps.gate.outcome }}';

            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              check_name: name,
            });
            const run = data.check_runs.find(c => c.name === name);
            if (!run) {
              console.log(`No "${name}" check run on ${sha}; nothing to correct.`);
              return;
            }
            if (run.conclusion === 'success' || run.conclusion === 'failure') {
              console.log(`"${name}" already concluded ${run.conclusion}.`);
              return;
            }
            const conclusion = gate === 'success' ? 'success' : 'failure';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: run.id,
              conclusion,
            });
            console.log(`"${name}": ${run.conclusion} -> ${conclusion} (gate ${gate})`);

      # No floor is enforced on this number yet, and that is a deliberate,
      # temporary state rather than an oversight: the only runtime code in the
      # repo is JetController, JetFlightConfig and QualityTierManager, and the
      # last of those reads SystemInfo at Awake and has no test. Setting a floor
      # today would mean picking a number the current code happens to hit, which
      # is how a gate becomes decoration. The floor lands with the cell that
      # gives QualityTierManager a seam worth testing.
      - name: Report C# coverage
        if: always()
        # tee, not a bare redirect: the number belongs in the step log as well
        # as the job summary. The script writes neither file itself, so no path
        # from the environment reaches it.
        #
        # pipefail because tee's exit status would otherwise mask the script's.
        # The reporter never gates on a missing number -- it exits 0 for that --
        # so the only status it can fail with is a caller error, which is
        # exactly the one worth surfacing rather than swallowing.
        run: |
          set -o pipefail
          python scripts/report_unity_coverage.py "${{ matrix.testMode }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unity-${{ matrix.testMode }}-results
          path: ${{ matrix.testMode }}-artifacts
